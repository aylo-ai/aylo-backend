name: repliuz
services:
  web:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
      - 8000:8000
    depends_on:
      - redis
      - postgres
    networks:
      - backend-net

  celery_beat:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config beat --loglevel=info
    restart: unless-stopped
    networks:
      - backend-net

  celery_worker:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config worker --loglevel=info
    restart: unless-stopped
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    networks:
      - backend-net

  postgres:
    # ports:
    #   - 5432:5432
    image: postgres:latest
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend-net

  redis:
    # ports:
    #   - 6379:6379
    image: redis:latest
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    networks:
      - backend-net


volumes:
  postgres_data:
  redis-data:

networks:
  backend-net:
    driver: bridge