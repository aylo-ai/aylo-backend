name: aylochat

services:
  web-blue:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    # Loopback-only: nginx is the sole public listener and proxies to this
    # port. Publishing on 0.0.0.0 would expose gunicorn directly, bypassing
    # TLS, client_max_body_size and the host access log.
    ports:
      - 127.0.0.1:8001:8000
    depends_on:
      - redis
      - postgres
    networks:
      - backend-net
    profiles:
      - blue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  web-green:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    # Loopback-only — see the note on web-blue.
    ports:
      - 127.0.0.1:8002:8000
    depends_on:
      - redis
      - postgres
    networks:
      - backend-net
    profiles:
      - green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config beat --loglevel=info
    restart: unless-stopped
    networks:
      - backend-net

  celery_worker:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config worker --loglevel=info -Q celery,default,ai,billing --concurrency=4
    restart: unless-stopped
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    networks:
      - backend-net

  celery_worker_low:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config worker --loglevel=info -Q broadcast,sync --concurrency=2
    restart: unless-stopped
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    networks:
      - backend-net

  postgres:
    image: postgres:17
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend-net

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    networks:
      - backend-net

  # --- Log viewer (profile: logs) -------------------------------------------
  #
  # Start with:  docker compose --profile logs up -d
  # Setup:       deployment/dozzle/setup.sh  (creates the login before first run)
  #
  # Two containers, ~40 MB total. Dozzle never touches the Docker socket: it
  # talks to a read-only HAProxy in front of it, so a compromised viewer cannot
  # create, exec into, or delete containers even if it wanted to.

  # Read-only Docker API gateway. CONTAINERS+INFO+EVENTS is the whole allowlist
  # Dozzle needs; every other API section (IMAGES, EXEC, VOLUMES, SECRETS, SWARM, …)
  # defaults to 0 and returns 403. POST=0 makes the entire API read-only.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No `ports`: reachable only from logs-net, never from the host or LAN.
    networks:
      - logs-net
    read_only: true
    # The entrypoint renders haproxy.cfg into /tmp at boot; /run holds the pid.
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2375"]
      interval: 5s
      timeout: 3s
      retries: 3
    profiles:
      - logs

  dozzle:
    image: amir20/dozzle:v10.6.13
    restart: unless-stopped
    environment:
      # Talk to the proxy, not to a mounted socket.
      DOZZLE_REMOTE_HOST: tcp://docker-socket-proxy:2375
      # Served under a path prefix by nginx — must match the location block in
      # deployment/nginx/api.aylo.uz.conf.
      DOZZLE_BASE: /_logs
      DOZZLE_HOSTNAME: aylochat
      # Only this project's containers; anything else on the host stays hidden.
      DOZZLE_FILTER: label=com.docker.compose.project=aylochat
      # Login required. Users live in deployment/dozzle/users.yml.
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 8h
      # Read-only viewer: no start/stop/restart, no container shells.
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_LEVEL: warn
    volumes:
      - ./deployment/dozzle/users.yml:/data/users.yml:ro
    # Loopback-only — nginx terminates TLS and is the sole public listener,
    # same rule as web-blue/web-green above.
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - logs-net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # `security_opt: [no-new-privileges:true]` belongs here too, but it makes
    # execve fail with EPERM on some kernels (reproduced on 7.0.0-28-generic,
    # where it breaks every image including alpine). Check the host first:
    #   docker run --rm --security-opt no-new-privileges:true alpine:3 echo ok
    # If that prints ok, add the option to both services above. With cap_drop
    # ALL the bounding set is already empty, so it adds little on top.
    profiles:
      - logs


volumes:
  postgres_data:
  redis-data:

networks:
  backend-net:
    driver: bridge
  # Isolated from backend-net: the log viewer has no route to postgres, redis
  # or the app containers, only to the socket proxy.
  logs-net:
    driver: bridge