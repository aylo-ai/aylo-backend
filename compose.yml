name: aylochat

services:
  web-blue:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles

      - ./secrets:/app/secrets:ro
    ports:
      - 127.0.0.1:8001:8000
    depends_on:
      redis:
        condition: service_started

      postgres:
        condition: service_started

      minio-init:
        condition: service_completed_successfully

    networks:
      - backend-net
    profiles:
      - blue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  web-green:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles

      - ./secrets:/app/secrets:ro

    ports:
      - 127.0.0.1:8002:8000
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend-net
    profiles:
      - green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config beat --loglevel=info
    restart: unless-stopped
    networks:
      - backend-net

  celery_worker:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config worker --loglevel=info -Q celery,default,ai,billing --concurrency=4
    restart: unless-stopped
    volumes:
      - /var/www/static:/app/staticfiles

      - ./secrets:/app/secrets:ro

    networks:
      - backend-net

  celery_worker_low:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config worker --loglevel=info -Q broadcast,sync --concurrency=2
    restart: unless-stopped
    volumes:
      - /var/www/static:/app/staticfiles

      - ./secrets:/app/secrets:ro

    networks:
      - backend-net

  postgres:
    image: postgres:17
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    env_file: .env
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./deployment/minio/init.sh:/init/init.sh:ro
      - ./deployment/minio/policy.json:/init/policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend-net
    restart: "no"
    cap_drop:
      - ALL

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    networks:
      - backend-net

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logs-net
    read_only: true

    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2375"]
      interval: 5s
      timeout: 3s
      retries: 3
    profiles:
      - logs

  dozzle:
    image: amir20/dozzle:v10.6.13
    restart: unless-stopped
    environment:
      DOZZLE_REMOTE_HOST: tcp://docker-socket-proxy:2375
      DOZZLE_BASE: /_logs
      DOZZLE_HOSTNAME: aylochat
      DOZZLE_FILTER: label=com.docker.compose.project=aylochat
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 8h
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_LEVEL: warn
    volumes:
      - ./deployment/dozzle/users.yml:/data/users.yml:ro
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - logs-net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    profiles:
      - logs


volumes:
  postgres_data:
  redis-data:
  minio-data:

networks:
  backend-net:
    driver: bridge
  logs-net:
    driver: bridge
