name: repliuz
services:
  web-blue:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
      - 8001:8000
    depends_on:
      - redis
      - postgres
    networks:
      - backend-net
    profiles:
      - blue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  web-green:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
      - 8002:8000
    depends_on:
      - redis
      - postgres
    networks:
      - backend-net
    profiles:
      - green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config beat --loglevel=info
    restart: unless-stopped
    networks:
      - backend-net

  celery_worker:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config worker --loglevel=info -Q celery,default,ai,billing --concurrency=4
    restart: unless-stopped
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    networks:
      - backend-net

  celery_worker_low:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A config worker --loglevel=info -Q broadcast,sync --concurrency=2
    restart: unless-stopped
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    networks:
      - backend-net

  postgres:
    image: postgres:17
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend-net

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    networks:
      - backend-net


volumes:
  postgres_data:
  redis-data:

networks:
  backend-net:
    driver: bridge
