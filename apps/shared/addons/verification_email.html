<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ subject|default:"Verification Code" }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
            padding: 30px;
        }
        .container {
            background: #fff;
            border-radius: 8px;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .code {
            font-size: 2em;
            font-weight: bold;
            color: #2d8cf0;
            letter-spacing: 4px;
            margin: 20px 0;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ subject|default:"Verification Code" }}</h2>
        <p>
            {{ user_name|default:"Dear User" }},<br>
            <br>
            Your verification code is:
        </p>
        <div class="code">{{ code }}</div>
        <p>
            This code will expire in {{ expiry_minutes|default:"5" }} minutes.<br>
            If you did not request this code, please ignore this email.
        </p>
        <div class="footer">
            &copy; {{ year|default:"2024" }} SG-AI
        </div>
    </div>
</body>
</html>
