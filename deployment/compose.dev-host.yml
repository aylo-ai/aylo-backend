services:
  web-green:
    restart: unless-stopped
    mem_limit: 640m

  celery_worker:
    command: celery -A config worker --loglevel=info -Q celery,default,ai,billing --concurrency=2
    mem_limit: 512m

  celery_worker_low:
    command: celery -A config worker --loglevel=info -Q broadcast,sync --concurrency=1
    mem_limit: 320m

  celery_beat:
    mem_limit: 256m

  postgres:
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    mem_limit: 192m

  dozzle:
    mem_limit: 128m

  docker-socket-proxy:
    mem_limit: 32m
