# Catch-all default server.
#
# Without this, nginx falls back to the first-loaded server block for any
# request whose Host header matches no `server_name` — so crawler and
# SEO-spam traffic aimed at the raw IP (or at parked domains pointed here)
# gets proxied through to gunicorn, which burns a worker to produce a
# `DisallowedHost` 400. `return 444` closes the connection without a
# response instead, so nothing reaches the app.
#
# `default_server` is explicit, so load order does not matter — but the 00-
# prefix keeps it obvious in sites-enabled listings.
#
# Install:
#   cp deployment/nginx/00-catchall.conf /etc/nginx/sites-available/00-catchall
#   ln -sfn /etc/nginx/sites-available/00-catchall /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default    # Debian's stock catch-all
#   nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log off;
    return 444;
}

# HTTPS catch-all. TLS must be terminated before nginx can see the Host
# header, so this block needs a certificate even though it serves nothing —
# reuse the one certbot issued for api.aylo.uz.
#
# Enable this block only after `certbot --nginx -d api.aylo.uz` has run,
# otherwise the cert paths do not exist yet and `nginx -t` fails.
#
# On nginx >= 1.19.4 the certificate lines can be replaced with a single
# `ssl_reject_handshake on;`, which aborts the handshake outright. Check with
# `nginx -v` before switching.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/api.aylo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aylo.uz/privkey.pem;

    access_log off;
    return 444;
}
