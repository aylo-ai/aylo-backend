# nginx site for api.aylo.uz (dev host 143.198.112.70).
#
# The app itself listens only on loopback: the dev workflow deploys the `green`
# profile, which publishes 127.0.0.1:8002. nginx is the only public listener.
#
# Install this alongside 00-catchall.conf, which absorbs every request whose
# Host header does not match a server_name below. Without it those requests
# fall through to this block and reach gunicorn.
#
# TLS is terminated here, with the Let's Encrypt cert for api.aylo.uz. The
# certificate must exist before this file loads, otherwise `nginx -t` fails on
# the ssl_certificate paths:
#   certbot certonly --nginx -d api.aylo.uz
#
# Install:
#   certbot certonly --nginx -d api.aylo.uz   # only if the cert is not there yet
#   cp deployment/nginx/api.aylo.uz.conf /etc/nginx/sites-available/api.aylo.uz
#   ln -sfn /etc/nginx/sites-available/api.aylo.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   # then install deployment/nginx/00-catchall.conf — see its header
#
# Do not let `certbot --nginx` (without `certonly`) rewrite this file — it
# appends its own duplicate TLS block. Renewal is unaffected: the nginx
# authenticator injects its challenge server block temporarily.
#
# The /_logs/ block below serves the Dozzle log viewer. It is inert until the
# container is up:
#   ./deployment/dozzle/setup.sh admin        # create the login (once)
#   docker compose --profile logs up -d
# The block denies every remote address (see it for how to reach the viewer).
# Nothing here starts that profile: the deploy path is `--profile green`
# (deployment/deploy.sh, .github/workflows/dev-deploy.yml), so the viewer only
# runs if a human ran the command above on the host.

# Requests to the legacy Telegram webhook route carry a customer's bot token as
# the last path segment (apps/integration/urls.py), and the access log records
# the whole request line — so one inbound message writes a live credential to
# disk in cleartext. Suppress the line entirely rather than rewriting it with a
# redacting log_format: a substitution that misses (an encoded slash, a route
# that moves) writes the token anyway, while a dropped line cannot half-fail.
# We lose inbound-webhook volume from this log; the app logs it upstream.
# Remove this map together with the legacy route once T-02 lands.
#
# Keyed on $uri, not $request_uri: $uri is normalized and percent-decoded, so
# an encoded variant of the same path cannot slip past the regex.
map $uri $aylo_request_is_loggable {
    ~^/api/v1/integration/telegram/webhook/  0;
    default                                  1;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aylo.uz;

    ssl_certificate     /etc/letsencrypt/live/api.aylo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aylo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Knowledge-base uploads and broadcast media.
    client_max_body_size 100M;

    access_log /var/log/nginx/api.aylo.uz.access.log combined if=$aylo_request_is_loggable;
    error_log  /var/log/nginx/api.aylo.uz.error.log;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # MinIO object storage. User media is no longer on the local filesystem, so
    # the old `alias /var/www/media/` block is gone — it served an empty
    # directory once the default storage moved to object storage.
    #
    # Three rules keep this block correct; breaking any one of them breaks every
    # media link:
    #
    #   1. NO path rewriting. `proxy_pass` has no trailing slash and there is no
    #      `rewrite`, so the URI reaches MinIO byte-for-byte. A presigned SigV4
    #      signature covers the full path — strip or add a prefix and MinIO
    #      recomputes a different signature and answers 403.
    #   2. `Host` is forwarded unchanged, for the same reason: the host is
    #      signed too, and Django signs with this public hostname.
    #   3. The query string carries the signature, so it must not be dropped.
    #
    # The bucket itself is private; without a valid signature MinIO returns 403
    # here, which is what makes it safe to expose this path at all.
    location /aylo-media/ {
        # Read-only from the internet. Even a leaked presigned PUT or DELETE
        # URL cannot be used through this edge — writes only happen from inside
        # the compose network.
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:9000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream objects straight through instead of spooling them in nginx.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;

        # Signed URLs already expire; letting a shared cache keep a copy would
        # outlive the grant. Browsers may cache privately for the URL's life.
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Media is data, never a page — stop any HTML/SVG from executing on the
        # API origin if it is opened directly.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        access_log off;
    }

    # Bare /_logs → /_logs/. No access rules here on purpose: `return` runs in
    # the rewrite phase, before the access phase, so an allow/deny in this block
    # would never be consulted. The redirect discloses nothing — its target 403s.
    location = /_logs {
        return 301 /_logs/;
    }

    # Dozzle log viewer (compose profile `logs`, see deployment/dozzle/).
    # The container publishes on 127.0.0.1:8080 only, so this block is the one
    # way in. Dozzle's own login is the second layer, not the first: the
    # allowlist below is, and it allows nothing but the host itself.
    #
    # Reach the viewer over an SSH tunnel, which lands on 127.0.0.1 and so is
    # allowed by the rules below:
    #   ssh -N -L 8080:127.0.0.1:8080 root@api.aylo.uz
    #   open http://127.0.0.1:8080/_logs/
    #
    # TODO(H-1): if browser access over TLS is wanted instead, a human must
    # supply the office / VPN egress addresses to allowlist here. None are
    # recorded anywhere in this repository, and a guessed address is either a
    # lock-out or a hole — so the list stays loopback-only until then.
    location /_logs/ {
        # First match wins, so `deny all` must stay last.
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        proxy_pass http://127.0.0.1:8080;

        # Log streaming is a long-lived websocket connection.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_buffering off;

        add_header X-Robots-Tag   "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match gunicorn's 600s timeout so long AI turns aren't cut at the edge.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_redirect off;
        proxy_buffering off;
    }
}

# Plain http exists only to push callers to TLS. 308 rather than 301 so a
# webhook POST keeps its method and body instead of being replayed as a GET.
server {
    listen 80;
    listen [::]:80;
    server_name api.aylo.uz;

    access_log off;

    return 308 https://$host$request_uri;
}
