# nginx site for api.aylo.uz (dev host 143.198.112.70).
#
# The app itself listens only on loopback: the dev workflow deploys the `green`
# profile, which publishes 127.0.0.1:8002. nginx is the only public listener.
#
# Install this alongside 00-catchall.conf, which absorbs every request whose
# Host header does not match a server_name below. Without it those requests
# fall through to this block and reach gunicorn.
#
# Install:
#   cp deployment/nginx/api.aylo.uz.conf /etc/nginx/sites-available/api.aylo.uz
#   ln -sfn /etc/nginx/sites-available/api.aylo.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.aylo.uz        # adds the TLS server block + redirect
#   # then install deployment/nginx/00-catchall.conf — see its header
#
# The /_logs/ block below serves the Dozzle log viewer. It is inert until the
# container is up:
#   ./deployment/dozzle/setup.sh admin        # create the login (once)
#   docker compose --profile logs up -d
# Reach it at https://api.aylo.uz/_logs/ — never over plain http, the login
# posts a password.

server {
    listen 80;
    listen [::]:80;
    server_name api.aylo.uz;

    # Knowledge-base uploads and broadcast media.
    client_max_body_size 100M;

    access_log /var/log/nginx/api.aylo.uz.access.log;
    error_log  /var/log/nginx/api.aylo.uz.error.log;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # MinIO object storage. User media is no longer on the local filesystem, so
    # the old `alias /var/www/media/` block is gone — it served an empty
    # directory once the default storage moved to object storage.
    #
    # Three rules keep this block correct; breaking any one of them breaks every
    # media link:
    #
    #   1. NO path rewriting. `proxy_pass` has no trailing slash and there is no
    #      `rewrite`, so the URI reaches MinIO byte-for-byte. A presigned SigV4
    #      signature covers the full path — strip or add a prefix and MinIO
    #      recomputes a different signature and answers 403.
    #   2. `Host` is forwarded unchanged, for the same reason: the host is
    #      signed too, and Django signs with this public hostname.
    #   3. The query string carries the signature, so it must not be dropped.
    #
    # The bucket itself is private; without a valid signature MinIO returns 403
    # here, which is what makes it safe to expose this path at all.
    location /aylo-media/ {
        # Read-only from the internet. Even a leaked presigned PUT or DELETE
        # URL cannot be used through this edge — writes only happen from inside
        # the compose network.
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:9000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream objects straight through instead of spooling them in nginx.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;

        # Signed URLs already expire; letting a shared cache keep a copy would
        # outlive the grant. Browsers may cache privately for the URL's life.
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Media is data, never a page — stop any HTML/SVG from executing on the
        # API origin if it is opened directly.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        access_log off;
    }

    # Dozzle log viewer (compose profile `logs`, see deployment/dozzle/).
    # The container publishes on 127.0.0.1:8080 only, so this block is the one
    # way in. Dozzle requires a login of its own; the allowlist below is the
    # second layer — uncomment it once you know the addresses you deploy from.
    location = /_logs {
        return 301 /_logs/;
    }

    location /_logs/ {
        # allow 203.0.113.4;      # office / VPN egress IP
        # allow 10.8.0.0/24;      # wireguard subnet
        # deny  all;

        proxy_pass http://127.0.0.1:8080;

        # Log streaming is a long-lived websocket connection.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_buffering off;

        add_header X-Robots-Tag   "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match gunicorn's 600s timeout so long AI turns aren't cut at the edge.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_redirect off;
        proxy_buffering off;
    }
}
