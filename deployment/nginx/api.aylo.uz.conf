server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aylo.uz;

    ssl_certificate     /etc/letsencrypt/live/api.aylo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aylo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Knowledge-base uploads and broadcast media.
    client_max_body_size 100M;

    access_log /var/log/nginx/api.aylo.uz.access.log;
    error_log  /var/log/nginx/api.aylo.uz.error.log;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # Dozzle log viewer (compose profile `logs`, see deployment/dozzle/).
    # The container publishes on 127.0.0.1:8080 only, so this block is the one
    # way in. Dozzle requires a login of its own; the allowlist below is the
    # second layer — uncomment it once you know the addresses you deploy from.
    location = /_logs {
        return 301 /_logs/;
    }

    location /_logs/ {
        # allow 203.0.113.4;      # office / VPN egress IP
        # allow 10.8.0.0/24;      # wireguard subnet
        # deny  all;

        proxy_pass http://127.0.0.1:8080;

        # Log streaming is a long-lived websocket connection.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_buffering off;

        add_header X-Robots-Tag   "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match gunicorn's 600s timeout so long AI turns aren't cut at the edge.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_redirect off;
        proxy_buffering off;
    }
}

# Plain http exists only to push callers to TLS. 308 rather than 301 so a
# webhook POST keeps its method and body instead of being replayed as a GET.
server {
    listen 80;
    listen [::]:80;
    server_name api.aylo.uz;

    access_log off;

    return 308 https://$host$request_uri;
}