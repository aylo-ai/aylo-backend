map $uri $aylo_request_is_loggable {
    ~^/api/v1/integration/telegram/webhook/  0;
    default                                  1;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aylo.uz;

    ssl_certificate     /etc/letsencrypt/live/api.aylo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aylo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Knowledge-base uploads and broadcast media.
    client_max_body_size 100M;

    access_log /var/log/nginx/api.aylo.uz.access.log combined if=$aylo_request_is_loggable;
    error_log  /var/log/nginx/api.aylo.uz.error.log;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /aylo-media/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:9000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;

        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        access_log off;
    }

    location = /_logs {
        return 301 /_logs/;
    }

    location /_logs/ {
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_buffering off;

        add_header X-Robots-Tag   "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_redirect off;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aylo.uz;

    access_log off;

    return 308 https://$host$request_uri;
}
