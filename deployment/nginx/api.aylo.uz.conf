server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aylo.uz;

    ssl_certificate     /etc/letsencrypt/live/api.aylo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aylo.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Knowledge-base uploads and broadcast media.
    client_max_body_size 100M;

    access_log /var/log/nginx/api.aylo.uz.access.log;
    error_log  /var/log/nginx/api.aylo.uz.error.log;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # User media lives in MinIO, not on disk. Django hands the browser a
    # presigned URL signed against MINIO_PUBLIC_URL (https://api.aylo.uz), so
    # the SigV4 signature covers this exact host and this exact path.
    #
    # Proxy it through byte-for-byte. `proxy_pass` is written without a URI
    # part on purpose: that form forwards the original request URI unchanged.
    # Writing `http://127.0.0.1:9000/` instead, or adding a rewrite, a prefix
    # or a trailing-slash fixup, changes the path MinIO signs over and turns
    # every media link into a 403. See the module docstring in
    # apps/shared/storages.py.
    #
    # `Host $host` matters for the same reason — MinIO recomputes the signature
    # from the Host header it receives.
    #
    # The path segment is the bucket name (MINIO_BUCKET_NAME, default
    # `aylo-media`). Renaming the bucket means editing this block too.
    location /aylo-media/ {
        # Read-only from the edge. Django writes to MinIO from inside the
        # compose network, so nothing legitimate ever PUTs or DELETEs through
        # nginx — and a presigned upload URL that leaks cannot be replayed here.
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:9000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Objects stream straight to the client; buffering a 100 MB knowledge
        # base document through nginx first only adds latency and disk churn.
        proxy_buffering off;
        proxy_read_timeout 300s;

        # Every URL here is signed for one recipient and expires, so it must
        # never be served to somebody else out of a shared cache. `private`
        # still lets the requesting browser reuse it while the signature lasts.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=300" always;

        # Signed, expiring, per-user links have nothing to gain from indexing.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Dozzle log viewer (compose profile `logs`, see deployment/dozzle/).
    # The container publishes on 127.0.0.1:8080 only, so this block is the one
    # way in. Dozzle requires a login of its own; the allowlist below is the
    # second layer — uncomment it once you know the addresses you deploy from.
    location = /_logs {
        return 301 /_logs/;
    }

    location /_logs/ {
        # allow 203.0.113.4;      # office / VPN egress IP
        # allow 10.8.0.0/24;      # wireguard subnet
        # deny  all;

        proxy_pass http://127.0.0.1:8080;

        # Log streaming is a long-lived websocket connection.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_buffering off;

        add_header X-Robots-Tag   "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match gunicorn's 600s timeout so long AI turns aren't cut at the edge.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_redirect off;
        proxy_buffering off;
    }
}

# Plain http exists only to push callers to TLS. 308 rather than 301 so a
# webhook POST keeps its method and body instead of being replayed as a GET.
server {
    listen 80;
    listen [::]:80;
    server_name api.aylo.uz;

    access_log off;

    return 308 https://$host$request_uri;
}