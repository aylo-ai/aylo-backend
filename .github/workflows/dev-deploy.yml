name: Deploy Dev Backend

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "README.md"
      - "docs/**"

concurrency:
  group: dev-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/aylo/backend
  SECRETS_DIR: /opt/aylo/.secrets

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Copy repo to dev server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          source: "."
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true

      - name: Deploy using docker compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}

            # Env file lives outside the repo tree and is never committed.
            cp ${{ env.SECRETS_DIR }}/backend.env .env

            # Host-sized overlay (1 vCPU / 2 GB): trims worker counts.
            cp deployment/compose.dev-host.yml compose.override.yml

            # Deploy with green profile (matching prod)
            docker compose --profile green up --build -d
            docker image prune -f || true

            echo "Backend dev deployment complete"

      - name: Health check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          script: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8002/health/ > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "waiting for app... ($i/30)"
              sleep 5
            done
            echo "Health check FAILED — recent web logs:"
            cd ${{ env.DEPLOY_DIR }} && docker compose --profile green logs --tail=50 web-green
            exit 1
