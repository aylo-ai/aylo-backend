name: Deploy Dev Backend

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "README.md"

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Copy repo to dev server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/opt/repli/backend"
          overwrite: true

      - name: Deploy using docker compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/repli/backend

            # Copy env file
            cp /opt/repli/.secrets/backend.env .env

            # Deploy with green profile (matching prod)
            docker compose --profile green down || true
            docker compose --profile green up --build -d
            yes | docker image prune -f || true

            echo "Backend dev deployment complete"
