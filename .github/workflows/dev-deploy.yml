name: Deploy Dev Backend

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "README.md"
      - "docs/**"

concurrency:
  group: dev-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/aylo/backend
  SECRETS_DIR: /opt/aylo/.secrets

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Backup current deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/aylo
            rm -rf backend.bak
            if [ -d backend ]; then
              cp -al backend backend.bak
            fi

      - name: Copy repo to dev server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          source: "."
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true

      - name: Deploy using docker compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            cp ${{ env.SECRETS_DIR }}/backend.env .env
            cp deployment/compose.dev-host.yml compose.override.yml
            docker compose --profile green up --build -d
            docker image prune -f || true
            echo "Backend dev deployment complete"

      - name: Health check
        id: health
        continue-on-error: true
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          script: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8002/health/ > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "waiting for app... ($i/30)"
              sleep 5
            done
            echo "Health check FAILED — recent web logs:"
            cd ${{ env.DEPLOY_DIR }} && docker compose --profile green logs --tail=50 web-green
            exit 1

      - name: Rollback to previous deployment
        if: steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /opt/aylo
            if [ ! -d backend.bak ]; then
              echo "No backup found — nothing to roll back to. Manual fix required."
              exit 1
            fi
            echo "Rolling back to previous working deployment..."
            cd backend
            docker compose --profile green down || true
            cd /opt/aylo
            rm -rf backend
            mv backend.bak backend
            cd backend
            cp ${{ env.SECRETS_DIR }}/backend.env .env
            cp deployment/compose.dev-host.yml compose.override.yml
            docker compose --profile green up --build -d
            echo "Rollback deployment complete"

      - name: Verify rollback health
        if: steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_HOST_DEV_USERNAME }}
          key: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
          port: 22
          script: |
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8002/health/ > /dev/null; then
                echo "Rollback verified healthy"
                exit 0
              fi
              sleep 5
            done
            echo "Rollback ALSO unhealthy — needs manual intervention"
            exit 1

      - name: Fail job (deployment was rolled back)
        if: steps.health.outcome == 'failure'
        run: |
          echo "New deployment failed health check and was rolled back to the previous version."
          exit 1