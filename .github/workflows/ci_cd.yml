name: Deployment for production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Deploy using docker compose
        run: |
            cp /home/mukhammad/.secrets/.env .
            docker compose down
            docker compose up --build -d
            yes | docker image prune
  deploy_gcp:
    name: Deploy to GCP
    runs-on: [self-hosted, linux, gcp]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          cp /home/mukhammad/.secrets/.env .
          docker compose down
          docker compose up --build -d
          yes | docker image prune