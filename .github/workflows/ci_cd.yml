name: Deployment for production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  deploy:
    name: Deploy to GCP
    runs-on: [self-hosted, linux, gcp]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          cp /home/mukhammad.irmatov/backend_drf/.secrets/.env .
          docker compose down
          docker compose up --build -d
          yes | docker image prune